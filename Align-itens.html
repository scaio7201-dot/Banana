<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Align-itens</title>
</head>
    <style>
        *{
     margin: 0;
     padding: 0;
     box-sizing: border-box;   
      }
      body {
        font-family: Arial, sans-serif;
        min-height: 100vh;
        background-color: #f5f0ff;
        padding: 30px;
      }
      h1 {
        text-align: center;
        color: #6a1b9a;
        background-color: #e1bee7;
        margin-bottom: 30px;
        align-items: stretch;
      }
      h2 {
        text-align: center;
        color: #4a148c;
        background-color: #d1c4e9;
        margin-bottom: 20px;
        align-items: flex-start;
      }
      h3 {
        text-align: center;
        color: #1a237e;
        background-color: #c5cae9;
        margin-bottom: 20px;
        align-items: flex-end;
      }
      h4 {
        text-align: center;
        color: #004d40;
        background-color: #b2dfdb;
        margin-bottom: 20px;
        align-items: center;
      }
    </style>
<body>
    <h1>Alinhamento de Itens Stretch</h1>
    <h2>Alinhamento Flex-Start</h2>
    <h3>Alinhamento Flex-End</h3>
    <h4>Alinhamento Center</h4>
    
</body>
</html>
