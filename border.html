<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Border</title>
    <style>
        .borda-solid {
            border: 3px solid red;
            padding: 15px;
            margin:25px;
        }

        .borda-dashed {
            border: 3px dashed blue;
            padding: 10px;
        }

        .borda-dotted {
            border: 3px dotted green;
            padding: 10px;
        }
    </style>
</head>

<body>
<div class="borda-solid">Borda sólida</div>

<div class="borda-dashed">Borda tracejada</div>

<div class="borda-dotted">Borda pontilhada</div>
</body>

</html>
