    <title>Galeria de Imagens</title>
</head>
<style>
    .container {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 15px;
        border-radius: 10px;
        padding: 20px;
    }

    .imagem, .imagem2 {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        width: 220px;
        transition: transform 0.3s ease;
        color: #333;
    }

    .imagem img, .imagem2 img {
        width: 220px;
        height: 180px;
        object-fit: cover;
        border-radius: 10px;
        display: block;
        transition: transform 0.3s ease;
    }

    .imagem:hover, .imagem2:hover,
    .imagem:hover img, .imagem2:hover img {
        transform: scale(1.1);
    }
</style>
