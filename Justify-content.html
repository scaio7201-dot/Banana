<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countanier</title>
</head>
<style>
    .counteiner {
        display: flex;
        justify-content: flex-start;
        align-items: center;
        padding: 15px;
        border: 2px solid #eb4c07;
        background-color: #11cb2d;
    }
    .counteiner2 {
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 10px;
        border: 2px solid #fb0490;
        background-color: #0202ed;
    }
    .counteiner3 {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 20px;
        border: 2px solid #05ec9f;
        background-color: #f9f9f9;
    }
    .counteiner4 {
        display: flex;
        justify-content: space-around;
        align-items: center;
        padding: 5px;
        border: 2px solid #98fb3b;
        background-color: #4a4848;
    }
</style>
<body>
    <div class="counteiner"> countainer 1</div>

    <div class="counteiner2"> countainer 2</div>

    <div class="counteiner3"> countainer 3</div>

    <div class="counteiner4"> countainer 4</div>
    
</body>
</html>
