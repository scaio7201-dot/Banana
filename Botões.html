<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Botões</title>
</head>
<style>
    body {
        background-color: lightgray;
    }
    .botão1 {
        background-color: brown;
        color: white;
        width:300px;
        height:100px;
        border-radius: 10px;
        transition: all;
    }
    .botão1:hover {
        background-color: blueviolet;
        color: white;
    }
    .pulse {
        background-color: darkblue;
        color: white;
        padding: 20px 40px;
        display: inline-block;
        width: 300px;
        height: 100px;
        border-radius: 10px;
        transition: all;
        animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
        25% {
            transform: scale(1.05);
        }
        50% {
            transform: scale(1);
        }
        75% {
            transform: scale(1.05);
        }
    }
</style>
<body>
    <h1 class="botão1"> Botão 1</h1>
    <div class="pulse">Pulse</div>
</body>
</html>
