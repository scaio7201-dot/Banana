<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seletor universal e posicionamento</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            min-height: 100vh;
        }

        .caixa,
        .caixa2,
        .caixa3 {
            padding: 15px;
            border: 3px solid red;
            background-color: #f0f0f0;
            margin: 10px;
        }

        .caixa:before:after {
            content: "!";
            position: fixed;
            top: 20px;
            left: 20px;
            width: 500px;
            content: "@";
        }

        .caixa2 {
            color: darkblue;
            background-color: lightgray;
            position: relative;
            bottom: 10px;
            left: 40px;
            width: 320px;
            min-height: 220px;
        }

        .caixa3 {
            position: absolute;
            top: 30px;
            left: 220px;
            width: 220px;
        }

        .caixa:hover {
            background-color: darkviolet;
            color: white;
        }

        .caixa2:active {
            color: darkgreen;
            background-color: gray;
        }
        .Lista:nth-child(odd) {
            position: relative;
            top: 20px;
            left: 20px;
            width: 200px;
            height: 100px;
            border: 2px solid black;
        }
    </style>
</head>

<body>
    <div class="caixa">1.Caixa com box-sizing e hover</div>

    <div class="caixa2">2.Caixa sem box-sizing e com active</div>

    <div class="caixa3">3.Caixa com box-sizing e margin</div>
    <div class="Lista">
        <ul>
            <li>Item 1</li>
            <li>Item 2</li>
            <li>Item 3</li>
        </ul>
    </div>
</body>

</html>
